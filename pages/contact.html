<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | LMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-600">LMS</h1>
    <div class="space-x-6">
      <a href="../index.html" class="hover:text-blue-600">Home</a>
      <a href="courses.html" class="hover:text-blue-600">Courses</a>
      <a href="about.html" class="hover:text-blue-600">About</a>
      <a href="contact.html" class="text-blue-600 font-semibold">Contact</a>
      <a href="faq.html" class="hover:text-blue-600">F A/Q</a>
    </div>
  </nav>

  <!-- Page Title -->
  <section class="text-center py-10">
    <h2 class="text-4xl font-bold mb-2">Contact Us</h2>
  </section>

  <!-- Contact Section -->
  <section class="max-w-5xl mx-auto bg-white p-8 rounded shadow grid md:grid-cols-2 gap-8">

    <!-- Contact Form -->
    <div>
      <h3 class="text-2xl font-semibold mb-4">Send a Message</h3>

      <form class="space-y-4">
        <input
          type="text"
          placeholder="Your Name"
          class="w-full border p-2 rounded"
          required
        >

        <input
          type="email"
          placeholder="Your Email"
          class="w-full border p-2 rounded"
          required
        >

        <textarea
          placeholder="Your Message"
          class="w-full border p-2 rounded h-32"
          required
        ></textarea>

        <button
          type="submit"
          class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600"
        >
          Send Message
        </button>
      </form>
    </div>

    <!-- Contact Details -->
    <div>
      <h3 class="text-2xl font-semibold mb-4">Contact Information</h3>

      <p class="mb-2"><strong>Email:</strong> support@lms.com</p>
      <p class="mb-2"><strong>Phone:</strong> +91 98765 43210</p>
      <p class="mb-2"><strong>Location:</strong> Chennai, India</p>

      <div class="mt-6 text-gray-600">
        Feel free to reach out for any queries related to courses,
        instructors, or enrollment.
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white text-center py-4 mt-10">
    © 2026 LMS Platform. All rights reserved.
  </footer>

</body>
</html>
